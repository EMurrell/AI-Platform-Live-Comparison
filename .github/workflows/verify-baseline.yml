name: Approve source-backed baseline

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type: I reviewed the source-backed baseline"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: u7-ai-comparison-writer
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Confirm the source-backed baseline
        env:
          SEED_VERIFICATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run verify-seed

      - name: Validate, test and build
        run: npm run check

      - name: Publish the approval record
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add data/current.json index.html
          git commit -m "chore: approve source-backed baseline"
          git push
