name: Daily source check

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-check
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Source check: cells need verification"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Check official sources
        run: npm run refresh

      - name: Build and test
        run: npm run check

      - name: Commit any changes
        run: |
          git config user.name "u7-data-bot"
          git config user.email "u7-data-bot@users.noreply.github.com"
          git add data/current.json index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: daily source check"
            git push
          fi

      - name: Collect cells that need a look
        id: cells
        run: |
          {
            echo "list<<CELLS_EOF"
            node -e '
              const data = require("./data/current.json");
              const labels = new Map(data.attributes.map(a => [a.id, a.label]));
              const names = new Map(data.providers.map(p => [p.id, p.name]));
              for (const cell of data.cells.filter(c => c.needs_verify)) {
                console.log(`- ${names.get(cell.provider)} / ${labels.get(cell.attribute)}: ${cell.source_url}`);
              }
            '
            echo "CELLS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(node -p 'require("./data/current.json").cells.filter(c => c.needs_verify).length')" >> "$GITHUB_OUTPUT"

      - name: Open or update the verification issue
        if: steps.cells.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CELL_LIST: ${{ steps.cells.outputs.list }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="$(printf 'The daily source check could not find the expected wording on these vendor pages. The page still shows the last confirmed values.\n\n%s\nRun: %s' "${CELL_LIST}" "${RUN_URL}")"
          NUMBER="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1)"
          if [ -n "${NUMBER}" ]; then
            gh issue edit "${NUMBER}" --body "${BODY}"
          else
            gh issue create --title "${ISSUE_TITLE}" --body "${BODY}"
          fi

      - name: Close the verification issue
        if: steps.cells.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1)"
          if [ -n "${NUMBER}" ]; then
            gh issue close "${NUMBER}" --comment "Every cell matched its source again."
          fi
