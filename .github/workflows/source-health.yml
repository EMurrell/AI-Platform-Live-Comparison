name: Check official source health

on:
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch:

concurrency:
  group: u7-ai-comparison-source-health
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check official source URLs
        id: source_health
        continue-on-error: true
        run: node scripts/check-links.mjs --json > source-health.json

      - name: Summarize source reachability
        if: always()
        run: |
          if [ ! -s source-health.json ]; then
            echo "::warning::The source-health report was not produced."
            exit 0
          fi
          HEALTHY="$(jq -r '.summary.healthy' source-health.json)"
          RESTRICTED="$(jq -r '.summary.restricted' source-health.json)"
          BROKEN="$(jq -r '.summary.broken' source-health.json)"
          echo "### Official source health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Healthy: ${HEALTHY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restricted by vendor: ${RESTRICTED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Broken: ${BROKEN}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${RESTRICTED}" -gt 0 ]; then
            echo "::warning::${RESTRICTED} official source(s) block automated requests. They are not counted as verified, but do not indicate a broken link."
          fi

      - name: Open or update the source-health issue
        if: steps.source_health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Automated source-health check needs attention"
        run: |
          {
            echo "The automated source-health check found one or more broken official source links."
            echo
            echo "Restricted or rate-limited pages are reported separately, are **not** treated as verified, and do not open this incident by themselves."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```json'
            if [ -s source-health.json ]; then
              cat source-health.json
            else
              echo '{"error":"The source-health report was not produced."}'
            fi
            echo '```'
          } > source-health-issue.md

          ISSUE_NUMBER=$(gh issue list \
            --state all \
            --search "\"$ISSUE_TITLE\" in:title" \
            --limit 10 \
            --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | first | .number // empty")

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue reopen "$ISSUE_NUMBER" || true
            gh issue edit "$ISSUE_NUMBER" --body-file source-health-issue.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file source-health-issue.md
          fi

      - name: Close the source-health issue after recovery
        if: steps.source_health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Automated source-health check needs attention"
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --limit 10 \
            --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | first | .number // empty")

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "Recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No broken source links remain; vendor-restricted pages continue to be reported as warnings rather than verified."
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Fail when source verification is incomplete
        if: steps.source_health.outcome == 'failure'
        run: |
          echo "::error::One or more official source links are broken. See the idempotent source-health issue."
          exit 1
